				}
			}
			
			for (var i = unStyleIndex, ilen = trArray.length; i < ilen; i++) {
				var firstTr = trArray[i];
				var firstTrTdArray = firstTr.childNodes;
				
				for (var j = 0, jlen = firstTrTdArray.length; j < jlen; j++) {

					firstTrTdArray[j].align = "center";
				}
			}
		}
	}
	//身份证验证  
function zjhYz(sfzjh){   
	if(document.getElementById("sfzjlxm").value=="1"){
		return validId(sfzjh);
	}
	return true; 	
} 
    var parityBit=new Array("1","0","X","9","8","7","6","5","4","3","2");      
    var powers=new Array("7","9","10","5","8","4","2","1","6","3","7","9","10","5","8","4","2");      
//校验身份证号码的主调用      
     
    function validId(obj){      
        var _id=obj.value;      
        if(_id==""){
        	alert('证件号不能为空！');
        	return false;      
        }
        var _valid=false;      
        if(_id.length==15){      
            _valid=validId15(_id);      
        }else if(_id.length==18){      
            _valid=validId18(_id);      
        }      
        if(!_valid){      
            alert('身份证号码有误,请检查!');
            //obj.focus();  
            //obj.value="";
            return false;      
        }
        return true;
              
              
    }          
    //校验18位的身份证号码      
     
    function validId18(_id){      
        _id=_id+"";      
        var _num=_id.substr(0,17);      
        var _parityBit=_id.substr(17);      
        var _power=0;      
        for(var i=0;i< 17;i++){      
            //校验每一位的合法性      
     
            if(_num.charAt(i)<'0'||_num.charAt(i)>'9'){      
                return false;      
                break;      
            }else{      
                //加权      
                _power+=parseInt(_num.charAt(i))*parseInt(powers[i]);      
                      
            }      
        }      
        //取模      
     
        var mod=parseInt(_power)%11;      
        if(parityBit[mod]==_parityBit){      
            return true;      
        }      
        return false;      
    }      
    //校验15位的身份证号码      
     
    function validId15(_id){      
        _id=_id+"";      
        for(var i=0;i<_id.length;i++){      
            //校验每一位的合法性      
     
            if(_id.charAt(i)<'0'||_id.charAt(i)>'9'){      
                return false;      
                break;      
            }      
        }      
        var year=_id.substr(6,2);      
        var month=_id.substr(8,2);      
        var day=_id.substr(10,2);      
        var sexBit=_id.substr(14);      
        //校验年份位      
     
        if(year<'01'||year >'90')return false;      
        //校验月份      
     
        if(month<'01'||month >'12')return false;      
        //校验日      
     
        if(day<'01'||day >'31')return false;      
          
        return true;      
    } 
function doSend(){
	document.getElementById("FormPrint").action = "/jsxsd/bygl/bysxx_save.do";
	document.getElementById("FormPrint").submit();
}
function dosavessss(type){
	if(document.getElementById("xm").value ==""){
		alert('姓名不能为空！');
		return false;
	}
	if(document.getElementById("sfzjh").value==""){

		return false;

	//验证身份证
	if(zjhYz(document.getElementById("sfzjh"))){
		document.getElementById("xmxg").value = document.getElementById("xm").value;
		document.getElementById("sfzjhxg").value= document.getElementById("sfzjh").value;
		document.getElementById("xmpyxg").value = document.getElementById("xmpy").value;
		document.getElementById("type").value = type;
		if("1" == type){
			if(document.getElementById("xm").value == document.getElementById("yxm").value && document.getElementById("sfzjh").value == document.getElementById("ysfzjh").value && document.getElementById("xmpy").value == document.getElementById("yxmpy").value){
				alert("您没有修改!不需要送审,直接点击确认无误！！");
				return false;
			}
			if(confirm('您确认所录入信息正确？一但确认无法再修改!!')){
				openWindow("/jsxsd/framework/user_select_ss.htmlx?id=userids&type=0&ywcode=153",440,320);
			}	
		}else{
			if(document.getElementById("xm").value != document.getElementById("yxm").value || document.getElementById("sfzjh").value != document.getElementById("ysfzjh").value || document.getElementById("xmpy").value != document.getElementById("yxmpy").value){
				alert("您已有修改,请点击修改保存提交送审！！");
				return false;				
			}
			if(confirm('您确认信息无误？一但确认无法再修改!!')){
				doSend();
			}
		}
	}
		
	
}
